<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayX JS Test (Standalone)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f8fafc;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        h1 { color: #1e293b; margin-bottom: 8px; }
        p { color: #64748b; margin-bottom: 32px; }
        button {
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(79, 70, 229, 0.4);
        }
        button:active { transform: translateY(0); }
        #result {
            margin-top: 24px;
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
            display: none;
            max-width: 400px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PayX SDK Test</h1>
        <p>Click below to test the premium checkout popup</p>
        <button id="pay-button">Pay GHS 10.00</button>
        <div id="result"></div>
    </div>

    <script>
        // --- INLINED SDK LOGIC FOR DEMO ---
        const PayX = {
            setup: (options) => {
                return {
                    open: () => {
                        const container = document.createElement('div');
                        Object.assign(container.style, {
                            position: 'fixed', top: '0', left: '0', width: '100%', height: '100%',
                            backgroundColor: 'rgba(0, 0, 0, 0.5)', display: 'flex',
                            alignItems: 'center', justifyContent: 'center', zIndex: '999999',
                            backdropFilter: 'blur(8px)', transition: 'opacity 0.3s ease'
                        });

                        const iframe = document.createElement('iframe');
                        const params = new URLSearchParams({
                            key: options.key,
                            amount: options.amount.toString(),
                            currency: options.currency || 'GHS',
                            email: options.email
                        });

                        iframe.src = `http://localhost:3000/checkout?${params.toString()}`;
                        Object.assign(iframe.style, {
                            width: '100%', maxWidth: '450px', height: '90vh', maxHeight: '700px',
                            border: 'none', borderRadius: '24px', backgroundColor: '#fff',
                            boxShadow: '0 25px 50px -12px rgba(0, 0, 0, 0.25)'
                        });

                        container.appendChild(iframe);
                        document.body.appendChild(container);

                        const handleMessage = (event) => {
                            if (event.origin !== 'http://localhost:3000') return;
                            const { type, data } = event.data;
                            if (type === 'PAYX_SUCCESS') { options.onSuccess?.(data); close(); }
                            if (type === 'PAYX_CANCEL') { options.onCancel?.(); close(); }
                        };

                        const close = () => {
                            container.style.opacity = '0';
                            setTimeout(() => { container.remove(); window.removeEventListener('message', handleMessage); }, 300);
                        };

                        window.addEventListener('message', handleMessage);
                        container.onclick = (e) => { if (e.target === container) { close(); options.onCancel?.(); } };
                    }
                };
            }
        };

        // --- TEST SCRIPT ---
        const payButton = document.getElementById('pay-button');
        const resultDiv = document.getElementById('result');

        payButton.onclick = () => {
            const handler = PayX.setup({
                key: 'px_test_fc35deb991684b74b70ccf084af5c3c5',
                email: 'test@example.com',
                amount: 10.00,
                onSuccess: (data) => {
                    resultDiv.style.display = 'block';
                    resultDiv.style.backgroundColor = '#d1fae5';
                    resultDiv.style.color = '#065f46';
                    resultDiv.textContent = '✅ Success: ' + JSON.stringify(data);
                },
                onCancel: () => {
                    resultDiv.style.display = 'block';
                    resultDiv.style.backgroundColor = '#fef3c7';
                    resultDiv.style.color = '#92400e';
                    resultDiv.textContent = '⚠️ Payment Cancelled';
                }
            });
            handler.open();
        };
    </script>
</body>
</html>
